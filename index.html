<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Resolve IT help desk tickets, climb from intern to founder, then build a global datacenter empire.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Helpdesk to Billions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky HUD + tab strip; Desk = ticket queue | workspace | runbook, collapsing to one column on phones.
   Identity: a help-desk console that slowly turns into a private-bank ledger. Ink navy for work, gold for money. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#121829; --muted:#5A6378; --line:#D5DBE6;
  --signal:#2449C9; --signal-ink:#FFFFFF; --signal-soft:#E3E9FB;
  --gold:#94620A; --gold-soft:#F6ECD6;
  --ok:#1D7A46; --ok-soft:#DFF2E7; --warn:#A35F00; --warn-soft:#FBEBD2; --bad:#B9332A; --bad-soft:#F9E1DE;
  --shadow:0 1px 2px rgba(18,24,41,.06),0 6px 20px rgba(18,24,41,.06);
  --o-hoodie:#56637F; --o-blazer:#1F3A7A; --o-turtleneck:#1B1B1F; --o-gold:#B07C14;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2E; --sunk:#10172A; --ink:#E7EBF3; --muted:#98A2B8; --line:#273150;
  --signal:#7E9DFF; --signal-ink:#0D1220; --signal-soft:#1D2A4F;
  --gold:#E6B655; --gold-soft:#2E2614;
  --ok:#5CCB8B; --ok-soft:#14301F; --warn:#F0A848; --warn-soft:#33240F; --bad:#F2776C; --bad-soft:#3A1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --sunk:#10172A; --ink:#E7EBF3; --muted:#98A2B8; --line:#273150;
  --signal:#7E9DFF; --signal-ink:#0D1220; --signal-soft:#1D2A4F;
  --gold:#E6B655; --gold-soft:#2E2614;
  --ok:#5CCB8B; --ok-soft:#14301F; --warn:#F0A848; --warn-soft:#33240F; --bad:#F2776C; --bad-soft:#3A1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 40px}
.app{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .85rem;font-weight:600;font-size:.9rem}
.btn:hover:not(:disabled){border-color:var(--signal)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.on{background:var(--signal-soft);border-color:var(--signal)}
.btn.gold{background:var(--gold);color:var(--surface);border-color:var(--gold)}
.btn.big{padding:.75rem 1.3rem;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 24px;align-items:center;border-bottom:1px solid var(--line)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.pname{font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prank{font-size:.8rem;color:var(--muted)}
.avatar{--o:var(--o-hoodie);width:42px;height:42px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--o)}
.avatar.lg{width:84px;height:84px;font-size:1.8rem}
.avatar[data-o="blazer"]{--o:var(--o-blazer)} .avatar[data-o="turtleneck"]{--o:var(--o-turtleneck)} .avatar[data-o="gold"]{--o:var(--o-gold)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;justify-content:center}
.stats div{min-width:0}
.stats dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.stats .gold{color:var(--gold)}
.meter{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.low i{background:var(--bad)}
.xp{min-width:180px}
.xpl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--signal);transition:width .4s}
.bar.goldbar i{background:var(--gold)}
.tabs{display:flex;gap:4px;padding-block:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:.45rem .9rem;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.desk{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:16px;align-items:start}
.queue h2,.runbook h2{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05rem;margin-bottom:10px}
.queue ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qi{width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;display:grid;gap:3px}
.qi[aria-current="true"]{border-color:var(--signal);background:var(--signal-soft)}
.qi .top{display:flex;justify-content:space-between;gap:6px;font-size:.78rem}
.qi .who2{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .sub{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad,.pill.late{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--signal-soft);color:var(--signal)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}

.work{display:grid;gap:14px}
.tk-head{display:grid;gap:8px}
.tk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sla{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.sla .bar i{transition:width 1s linear}
.sla.warn .bar i{background:var(--warn)} .sla.late .bar i{background:var(--bad)}
.msg{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.msg-from{font-size:.82rem;color:var(--muted)}
.msg blockquote{margin:0;font-size:1rem;max-width:65ch}
.given{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;padding-top:8px;border-top:1px dashed var(--line)}
.given b{font-weight:600}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--muted)}
.step.done .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step-body{display:grid;gap:10px;min-width:0}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rec dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rec dd{margin:0;font-size:.9rem;overflow-wrap:anywhere}
.rec .wide{grid-column:1/-1}
.subpanel{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;background:var(--sunk)}
.temp{font-family:var(--f-mono);font-size:1.05rem;letter-spacing:.04em}
label.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.form input[type=text],.form select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;font-size:.9rem;width:100%}
.groups{display:flex;flex-wrap:wrap;gap:6px 14px}
.groups label{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--ink);font-weight:400}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.log li::before{content:"› ";color:var(--signal)}
.hint{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem}
.result{border-radius:12px;padding:16px 18px;display:grid;gap:10px;border:1px solid var(--line)}
.result.l0{background:var(--ok-soft)} .result.l1{background:var(--warn-soft)} .result.l2,.result.l3{background:var(--bad-soft)}
.result ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:70ch}
.delta{display:flex;flex-wrap:wrap;gap:6px}

.runbook{font-size:.86rem}
.runbook details{border-top:1px solid var(--line);padding-block:8px}
.runbook details:first-of-type{border-top:0}
.runbook summary{font-weight:600;cursor:pointer}
.runbook ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.runbook table{border-collapse:collapse;width:100%;margin-top:6px;font-size:.78rem}
.runbook td{border-top:1px solid var(--line);padding:4px 4px 4px 0;vertical-align:top}
.runbook td:first-child{font-weight:600}

.brief{display:grid;gap:16px;padding:28px}
.brief .lede{font-size:1.05rem;max-width:62ch;color:var(--muted)}
.brief-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}

.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0}
.ladder li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0}
.ladder .mk{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:4px}
.ladder .past .mk{background:var(--ink);border-color:var(--ink)}
.ladder .now .mk{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.ladder .future{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.journal{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.journal li{display:grid;gap:2px;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.card .price{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.notice{border:1px dashed var(--gold);background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.88rem}
.section{display:grid;gap:12px;margin-bottom:26px}
.small{font-size:.82rem}
.empire-head{margin-bottom:20px}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card.build{border-style:dashed;border-color:var(--gold);background:var(--gold-soft)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.mini dt{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem}
.bar.health i{background:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{font-size:.78rem;padding:.45rem .5rem}
.incident{border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:var(--bad-soft);border-radius:12px;padding:16px;display:grid;gap:10px}
.incident .choice{background:var(--surface)}
.table-wrap{overflow-x:auto}
table.staff{border-collapse:collapse;width:100%;font-size:.88rem}
table.staff th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0}
table.staff td{border-top:1px solid var(--line);padding:10px 8px 10px 0;vertical-align:top}
table.staff .num{font-variant-numeric:tabular-nums;white-space:nowrap}
table.staff .btn{font-size:.78rem;padding:.4rem .6rem;white-space:nowrap}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .body{display:grid;gap:10px;color:var(--muted);max-width:62ch}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.choice:hover{border-color:var(--signal)}
.choice b{font-size:.95rem}
.choice span{font-size:.82rem;color:var(--muted)}
.modal input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.88rem;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:1060px){
  .desk{grid-template-columns:220px minmax(0,1fr)}
  .desk .runbook{grid-column:1/-1}
  .brief-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .hud{grid-template-columns:1fr;gap:10px}
  .stats{justify-content:flex-start;gap:6px 16px}
  .desk,.cols{grid-template-columns:1fr}
  .queue ol{grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);overflow-x:auto;padding-bottom:4px}
  .brief{padding:20px}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="hud" id="hud"></header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function money(n){
  const s = n < 0 ? '−' : ''; n = Math.abs(n);
  if (n >= 1e12) return s + '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return s + '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return s + '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e5) return s + '$' + Math.round(n/1e3) + 'K';
  return s + '$' + Math.round(n).toLocaleString('en-US');
}

/* ---------- world data ---------- */
const FIRST = ['Priya','Marcus','Elena','Tomás','Aisha','Kenji','Grace','Diego','Fatima','Noah','Lena','Omar','Sofia','Wei','Hannah','Jamal','Ingrid','Ravi','Chloe','Mateo','Amara','Lucas','Yuki','Bianca'];

const GROUPS = {Sales:['SG-Sales','CRM-Users'],Engineering:['SG-Engineering','GitHub-Users'],Finance:['SG-Finance','ERP-Users'],HR:['SG-HR','HRIS-Users'],Marketing:['SG-Marketing','CMS-Users'],Operations:['SG-Operations','WMS-Users']};
const ALL_GROUPS = ['All-Staff', ...DEPTS.flatMap(d => GROUPS[d]), 'Domain-Admins'];
const LICENSES = ['M365 E3','M365 E5','No license'];
const licenseFor = d => d === 'Engineering' ? 'M365 E5' : 'M365 E3';
const CLIENTS = [{name:'Halcyon Foods',domain:'halcyonfoods.com'},{name:'Northpine Credit Union',domain:'northpinecu.org'},{name:'Vireo Health',domain:'vireohealth.com'},{name:'Quarry & Stone Law',domain:'quarrystone.law'},{name:'Lumen Aerospace',domain:'lumenaero.com'},{name:'Tidewater Schools',domain:'tidewater.edu'}];

const WORDS = ['Cedar','Harbor','Copper','Maple','Quartz','Juniper','Falcon','Ember','Tundra','Willow'];

const RANKS = [
  {name:'Help Desk Intern',xp:0,pay:40,tickets:4,blurb:'Phones, passwords, and a desk next to the printer.'},
  {name:'IT Support Technician',xp:150,pay:90,tickets:5,blurb:'New hire accounts are yours now. Follow the naming rule.'},
  {name:'Systems Administrator',xp:420,pay:220,tickets:5,blurb:'You hold the keys to the directory. Attackers know it, and they will call.'},
  {name:'IT Manager',xp:850,pay:520,tickets:6,blurb:'Four technicians report to you. Lockouts start looking suspicious.'},
  {name:'Chief Technology Officer',xp:1450,pay:1400,tickets:6,blurb:'Board meetings by day, password resets by habit.'},
  {name:'Startup Founder',xp:2300,pay:0,tickets:6,blurb:'Your identity platform runs the help desks of other companies. Every clean ticket grows the valuation.'},
  {name:'Tech Billionaire',xp:Infinity,pay:0,tickets:6,blurb:'Your stake is worth over $1B. The tickets still come in.'}
];
const POOLS = [
  ['reset','reset','unlock','resetLocked'],
  ['reset','unlock','resetLocked','create','create'],
  ['reset','unlock','resetLocked','create','social','createFake'],

function lookalike(d){

function swapDigits(id){

  return 'E-' + d.join('');
}

function makeTicket(kind, i){

    st:{lookedUp:owns('monitor') && KINDS[kind].lookup, verified:null, actions:[], mustChange:false, blind:false, resetOpen:false, hint:false, avail:null,

      t.channel = 'Chat'; t.from = `${name} · ${dept}`; t.subject = 'Locked out?';
      t.body = `My account says it's locked, but I haven't even tried to log in today. Can you just unlock it? I have a meeting in ten minutes.`;
      break;
    case 'social': {
      user.title = rnd(['VP of Finance','Chief Revenue Officer','VP of Sales']);
      const mismatchManager = Math.random() < .4;
      t.provided = mismatchManager ? {empId, manager: rnd(MANAGERS.filter(m => m !== manager))} : {empId: swapDigits(empId), manager};

      const taken = Math.random() < .45;
      const twinFirst = rnd(FIRST.filter(f => f[0] === hire.first[0] && f !== hire.first)) || hire.first[0] + '.';
      t.hire = hire; t.user = null;

/* ---------- shift flow ---------- */
function startShift(){
  const rank = state.rank;
  const pool = POOLS[Math.min(rank, 3)];
  const n = RANKS[rank].tickets;
  const kinds = [];
  for (let i = 0; i < n; i++) kinds.push(rnd(pool));
  if (rank >= 2 && !kinds.some(k => ['social','createFake','unlockAttack'].includes(k))) kinds[ri(1, n-1)] = rnd(pool.filter(k => ['social','createFake','unlockAttack'].includes(k)));
  if (rank >= 1 && !kinds.includes('create') && !kinds.includes('createFake')) kinds[0] = 'create';
  const tickets = kinds.map((k, i) => makeTicket(k, i));
  state.shift = {tickets, active:tickets[0].id, cash:0, xp:0, rep:0, gems:0, valStart: state.founder ? state.founder.valuation : 0};
  state.tab = 'desk';
  commit();
}
const activeTicket = () => state.shift && state.shift.tickets.find(t => t.id === state.shift.active);

function act(type){
  const t = activeTicket(); if (!t || t.done) return;
  const st = t.st, K = KINDS[t.kind];
  if (st.actions.some(a => a.type === type)) { toast('Already done on this ticket.'); return; }
  if (K.lookup && (type === 'unlock' || type === 'reset') && !st.lookedUp) { toast('Look up the account first.'); return; }
  if (type === 'unlock' && t.user.status !== 'Locked') { toast(`${t.user.username} is not locked. Nothing to unlock.`); return; }
  if (['unlock','reset','create'].includes(type) && st.verified === null) st.blind = true;
  let line = '';
  if (type === 'unlock'){ t.user.status = 'Active'; t.user.badPwd = 0; line = `Unlock-Account ${t.user.username} · status Active`; }
  if (type === 'reset'){ st.mustChange = !!($('#mustChange') && $('#mustChange').checked); st.resetOpen = false;
    line = `Set-Password ${t.user.username} · temp issued · change at next sign-in: ${st.mustChange ? 'yes' : 'NO'}`; }
  if (type === 'escalate'){ line = `Escalated to Security Operations · ${t.id}`; }
  if (type === 'create'){
    const f = st.form;
    if (!f.username || !f.dept || !f.license){ toast('Fill in username, department and license first.'); return; }
    st.created = JSON.parse(JSON.stringify(f));
    line = `New-User ${f.username} · ${f.dept} · ${f.groups.join(', ') || 'no groups'} · ${f.license}`;
  }
  st.actions.push({type, line});
  commit();
}

function grade(t){
  const K = KINDS[t.kind], st = t.st, did = new Set(st.actions.map(a => a.type));
  const notes = []; let level = 0;
  const bump = (l, m) => { level = Math.max(level, l); notes.push(m); };
  for (const f of K.forbidden) if (did.has(f)) bump(3, FORBID[t.kind][f]);
  for (const a of K.actions) if (!did.has(a)) bump(2, MISSING[a]);
  for (const a of did) if (!K.actions.includes(a) && !K.forbidden.includes(a)) bump(a === 'escalate' ? 2 : 1, EXTRA[a]);
  if (st.verified === null) bump(1, 'You never recorded the identity check. Verify before every account change.');
  else if (st.verified !== K.identity) bump(1, K.identity ? 'The details actually matched. Read the record again before flagging someone.' : 'The details did not match. You should have flagged it.');
  if (st.blind && st.verified !== null) bump(1, 'You changed the account before verifying. Order matters.');
  if (did.has('reset') && !st.mustChange && level < 3) bump(1, 'Always require a password change at next sign-in so only the user knows the final password.');
  if (did.has('create') && t.kind === 'create'){
    const f = st.created, x = t.expectForm; let errs = 0;
    if (f.username.trim().toLowerCase() !== x.username){ errs++; bump(1, `Username should be ${x.username}: ${x.taken ? `${x.base} was taken, so add 2` : 'first initial plus last name, lowercase'}.`); }
    if (f.dept !== x.dept){ errs++; bump(1, `Department should be ${x.dept}.`); }
    if ([...f.groups].sort().join() !== [...x.groups].sort().join()){ errs++;
      bump(f.groups.includes('Domain-Admins') ? 2 : 1, f.groups.includes('Domain-Admins') ? 'Domain-Admins on a new hire is a serious least-privilege violation.' : `Groups should be exactly ${x.groups.join(', ')}.`); }
    if (f.license !== x.license){ errs++; bump(1, `License should be ${x.license}.`); }
    if (errs >= 3) bump(2, 'Too many errors. The account will need to be rebuilt.');
  }
  if (level === 0) notes.unshift(K.win);
  return {level, notes};
}

function resolve(){
  const t = activeTicket(); if (!t || t.done) return;
  const g = grade(t), L = g.level, r = RANKS[state.rank];
  const inSla = t.age <= t.sla;
  let cash, val = 1;
  if (state.founder){
    cash = [2500, 1000, 0, -5000][L];
    val = [1.16, 1.05, 0.98, 0.85][L] + (L === 0 && inSla ? .02 : 0);
    state.founder.valuation *= val;
  } else {
    const mult = (0.5 + state.rep / 100) * (owns('keyboard') ? 1.15 : 1);
    cash = Math.round([1, .5, 0, -.5][L] * r.pay * mult);
    if (L === 0 && inSla) cash += Math.round(r.pay * .25);
  }
  const xp = Math.round([30, 12, 3, 0][L] * (1 + state.rank * .35) * (owns('headset') ? 1.1 : 1));
  const rep = [3, 0, -4, -12][L] + (L === 0 && owns('office') ? 1 : 0);
  const gems = L === 0 ? 1 : 0;
  state.cash += cash; state.xp += xp; state.rep = clamp(state.rep + rep, 0, 100); state.gems += gems;
  state.stats.resolved++; if (L === 0) state.stats.perfect++; if (L === 3) state.stats.breach++;
  Object.assign(state.shift, {cash: state.shift.cash + cash, xp: state.shift.xp + xp, rep: state.shift.rep + rep, gems: state.shift.gems + gems});
  t.done = true; t.result = {...g, cash, xp, rep, gems, val, inSla};
  commit();
}

function nextTicket(){
  const open = state.shift.tickets.find(t => !t.done);
  if (open){ state.shift.active = open.id; commit(); window.scrollTo({top:0}); }
}

function endShift(){
  const s = state.shift, ts = s.tickets;
  const summary = {day:state.day, tickets:ts.length, clean:ts.filter(t => t.result.level === 0).length, incidents:ts.filter(t => t.result.level === 3).length,
    cash:s.cash, xp:s.xp, rep:s.rep, gems:s.gems, valGrowth: state.founder && s.valStart ? state.founder.valuation / s.valStart : null};
  state.lastShift = summary; state.shift = null; state.day++; state.stats.shifts++;
  state.modals.push({type:'report', data:summary});
  if (state.rep <= 0) state.modals.push({type:'pip'});
  while (state.rank < 5 && state.xp >= RANKS[state.rank + 1].xp){ state.rank++; state.gems += 5; state.modals.push({type:'story', rank:state.rank}); }
  if (state.founder && !state.founder.seriesA && state.founder.valuation >= 1e8) state.modals.push({type:'seriesA'});
  commit();
}

function modalSpec(m){

    body:['You are the new intern. The phones ring, the passwords are forgotten, and every ticket you close well moves you up.','Look up the account, verify the person, take only the actions the ticket needs, then resolve. Get careless and you will hand an attacker the keys.','Climb from intern to CTO, found your own company, build datacenters around the world, and reach a $1B net worth. Then keep going.'],
    choices:[{label:'Got it',sub:'Your first shift has 4 tickets. The runbook sits beside every ticket.',fx(){}}]};
  if (m.type === 'report'){
    const d = m.data;
    return {eyebrow:`End of day ${d.day}`, title: d.incidents ? 'Rough shift.' : d.clean === d.tickets ? 'Perfect shift.' : 'Shift complete.',
      body:[`${d.clean} of ${d.tickets} tickets resolved cleanly${d.incidents ? `, ${d.incidents} security incident${d.incidents > 1 ? 's' : ''}` : ''}.`,
            `Earned ${money(d.cash)}, ${d.xp} XP, ${d.gems} gem${d.gems === 1 ? '' : 's'}. Reputation ${d.rep >= 0 ? '+' : ''}${d.rep}.` + (d.valGrowth ? ` Valuation grew ${((d.valGrowth - 1) * 100).toFixed(0)}%.` : '')],
      choices:[{label:'Continue',sub:'',fx(){}}]};
  }
  if (m.type === 'pip') return {eyebrow:'Performance review', title:'HR wants a word.',
    body:['Your reputation hit zero. You are placed on a performance plan and lose part of your savings to a "mandatory retraining" fee.'],
    choices:[{label:'Accept the plan',sub:'Reputation resets to 25 · −20% cash',fx(){state.rep = 25; state.cash = Math.round(state.cash * .8);}}]};
  if (m.type === 'seriesA') return {eyebrow:`${esc(state.founder.name)} · Series A`, title:'Your valuation passed $100M.',
    body:['A growth fund wants in. More capital means faster growth, but you give up part of the company.'],
    choices:[{label:'Take the Series A',sub:'Valuation ×1.5 · your stake ×0.8',fx(){state.founder.valuation *= 1.5; state.founder.stake *= .8; state.founder.seriesA = 'taken';}},
             {label:'Stay lean',sub:'+15 reputation, keep your stake',fx(){state.rep = clamp(state.rep + 15, 0, 100); state.founder.seriesA = 'declined';}}]};
  if (m.type === 'billionaire') return {eyebrow:'Net worth over $1B', title:'You are a tech billionaire.',
    body:[`It started with a forgotten password at Brightline Logistics. Now ${esc(state.founder.name)} handles identity for companies around the world.`,'The tickets will keep coming. What now?'],
    choices:[{label:'Keep building',sub:'+50 gems',fx(){state.gems += 50; state.rank = 6;}},
             {label:'Fund free IT training for students',sub:'+30 reputation · donate 5% of your shares',fx(){state.rep = clamp(state.rep + 30, 0, 100); state.founder.stake *= .95; state.rank = 6;}}]};
  if (m.type === 'story') return STORIES[m.rank];
  if (m.type === 'away') return {eyebrow:'Welcome back', title:`Your infrastructure ran for ${fmtDur(m.data.secs)}.`,
    body:[`While you were away your datacenters earned ${money(m.data.net)} after payroll. Offline time runs at half speed, up to 8 hours. No incidents happen while you are offline.`],
    choices:[{label:'Back to work',sub:'',fx(){}}]};
  if (m.type === 'milestone'){
    const ms = MILESTONES.find(x => x.v === m.v);
    return {eyebrow:'Milestone', title:`${ms.name}.`, body:[`Your net worth passed ${money(ms.v)}. The board sends a bonus of ${ms.gems} gems.`], choices:[{label:'Keep building',sub:'',fx(){}}]};
  }
}

/* ---------- render ---------- */
function commit(){ save(); render(); }
function render(){ renderHud(); renderTabs(); renderView(); renderModal(); }

function avatar(lg){ return `<div class="avatar${lg ? ' lg' : ''}" data-o="${state.outfit}" aria-hidden="true">${esc(initials(state.name))}</div>`; }

function renderHud(){
  const r = RANKS[state.rank], next = RANKS[state.rank + 1];
  let prog;
  if (state.founder){
    const nw = netWorth(), goal = [1e9, 1e10, 1e11, 1e12, 1e13].find(g => nw < g) || 1e13;
    const pct = clamp(nw / goal, 0, 1) * 100;
    prog = `<div class="xp"><div class="xpl"><span>Day ${state.day}</span><span>${money(nw)} of ${money(goal)}</span></div><div class="bar goldbar"><i style="width:${pct}%"></i></div></div>`;
  } else if (!isFinite(next.xp)){
    prog = `<div class="xp"><div class="xpl"><span>Day ${state.day}</span><span>Founder</span></div><div class="bar goldbar"><i style="width:0%"></i></div></div>`;
  } else {
    const pct = clamp((state.xp - r.xp) / (next.xp - r.xp), 0, 1) * 100;
    prog = `<div class="xp"><div class="xpl"><span>Day ${state.day}</span><span>${state.xp} / ${next.xp} XP</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;

  $('#hud').innerHTML = `

    <dl class="stats">

      <div><dt>Gems</dt><dd>${state.gems}</dd></div>
      <div><dt>Reputation</dt><dd>${state.rep}<span class="meter${state.rep < 25 ? ' low' : ''}"><i style="width:${state.rep}%"></i></span></dd></div>
    </dl>${prog}`;
}
function renderTabs(){
  const tabs = [['desk','Desk'],['empire','Empire'],['career','Career'],['shop','Shop'],['profile','Profile']];
  const alert = id => state.tab !== id && ((id === 'desk' && state.shift) || (id === 'empire' && state.empire && state.empire.incidents.length));
  const sig = state.tab + tabs.map(([id]) => alert(id) ? 1 : 0).join('');
  if (sig === renderTabs.sig && $('#tabs').childElementCount) return;
  renderTabs.sig = sig;
  $('#tabs').innerHTML = tabs.map(([id, l]) => `<button data-act="tab" data-v="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${l}${alert(id) ? '<span class="dot"></span>' : ''}</button>`).join('');
}
function renderView(){
  const v = $('#view');
  if (state.tab === 'desk') v.innerHTML = state.shift ? deskView() : briefView();
  if (state.tab === 'empire') v.innerHTML = empireView();
  if (state.tab === 'career') v.innerHTML = careerView();
  if (state.tab === 'shop') v.innerHTML = shopView();

function slaInfo(t){
  const left = t.sla - t.age, pct = clamp(left / t.sla, 0, 1) * 100;
  const cls = left <= 0 ? 'late' : left < 25 ? 'warn' : 'ok';
  const txt = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} to SLA` : 'SLA missed';
  return {pct, cls, txt};
}
const GRADE = ['Clean resolution','Resolved with issues','Not resolved','Security incident'];
const GRADE_PILL = ['ok','warn','bad','bad'];

function deskView(){
  const s = state.shift, t = activeTicket();
  const open = s.tickets.filter(x => !x.done).length;
  const q = s.tickets.map(x => {
    const name = x.user ? `${x.user.first} ${x.user.last}` : x.from;
    const sl = slaInfo(x);
    const badge = x.done ? `<span class="pill ${GRADE_PILL[x.result.level]}">${['Clean','Issues','Failed','Incident'][x.result.level]}</span>` : `<span class="pill ${sl.cls}" data-slapill="${x.id}">${sl.txt}</span>`;
    return `<li><button class="qi" data-act="pick" data-v="${x.id}" aria-current="${x.id === s.active}"><span class="top"><span class="mono">${x.id}</span>${badge}</span><span class="who2">${esc(name)}</span><span class="sub">${x.channel} · ${esc(x.subject)}</span></button></li>`;
  }).join('');
  return `<div class="desk">
    <aside class="panel queue" aria-label="Ticket queue"><h2>Queue <span class="eyebrow">${open} open</span></h2><ol>${q}</ol>
      ${open === 0 ? `<button class="btn primary" style="width:100%;margin-top:12px" data-act="end">Clock out</button>` : ''}</aside>
    <section class="panel work" aria-label="Ticket">${ticketView(t)}</section>
    ${runbook()}</div>`;
}

function ticketView(t){
  const K = KINDS[t.kind], st = t.st, sl = slaInfo(t), isCreate = !K.lookup;

  const head = `<header class="tk-head"><div class="tk-meta"><span class="mono">${t.id}</span><span class="chip">${t.channel}</span><span class="chip">${K.label}</span>${state.founder ? `<span class="chip">Client: ${esc(t.co.name)}</span>` : ''}</div>
    <h2>${esc(t.subject)}</h2>
    ${t.done ? '' : `<div class="sla ${sl.cls}" data-sla="${t.id}"><div class="bar"><i style="width:${sl.pct}%"></i></div><span>${sl.txt}</span></div>`}</header>`;
  const given = isCreate
    ? `<div class="given"><span>Sender <b class="mono">${esc(t.from)}</b></span><span>Company domain <b class="mono">${esc(t.co.domain)}</b></span></div>`
    : `<div class="given"><span>Requester gives: Employee ID <b class="mono">${t.provided.empId}</b></span><span>Manager <b>${esc(t.provided.manager)}</b></span></div>`;
  const msg = `<div class="msg"><div class="msg-from">From ${esc(t.from)} · via ${t.channel}</div><blockquote>${esc(t.body)}</blockquote>${given}</div>`;

  if (isCreate){

  } else if (!st.lookedUp){
    step1 = `<div class="step"><span class="n">1</span><div class="step-body"><h3>Look up the account</h3><div class="row"><button class="btn" data-act="lookup">Search directory for “${esc(u.first)} ${esc(u.last)}”</button></div></div></div>`;
  } else {
    const statusPill = u.status === 'Locked' ? '<span class="pill bad">Locked</span>' : '<span class="pill ok">Active</span>';
    step1 = `<div class="step done"><span class="n">1</span><div class="step-body"><h3>Directory record</h3>
      <dl class="rec"><div><dt>Name</dt><dd>${esc(u.first)} ${esc(u.last)}</dd></div><div><dt>Username</dt><dd class="mono">${u.username}</dd></div>
      <div><dt>Employee ID</dt><dd class="mono">${u.empId}</dd></div><div><dt>Manager</dt><dd>${esc(u.manager)}</dd></div>
      <div><dt>Department</dt><dd>${u.dept} · ${esc(u.title)}</dd></div><div><dt>Status</dt><dd>${statusPill}</dd></div>
      <div><dt>Failed sign-ins</dt><dd class="mono">${u.badPwd}</dd></div><div><dt>Last failure</dt><dd>${u.lastFail}</dd></div>
      <div class="wide"><dt>Failure source</dt><dd class="mono">${esc(u.src)}</dd></div><div><dt>Phone on file</dt><dd class="mono">${u.phone}</dd></div></dl></div></div>`;
  }

  const vq = isCreate ? 'Is this request authorized?' : 'Do the requester’s details match the directory?';
  const [yes, no] = isCreate ? ['Authorized', 'Not authorized'] : ['Details match', 'Details don’t match'];
  const vDisabled = (!isCreate && !st.lookedUp) || t.done ? 'disabled' : '';
  const step2 = `<div class="step ${st.verified !== null ? 'done' : ''}"><span class="n">2</span><div class="step-body"><h3>${vq}</h3>
    <div class="row"><button class="btn ${st.verified === true ? 'on' : ''}" data-act="verify" data-v="1" ${vDisabled}>${yes}</button><button class="btn ${st.verified === false ? 'on' : ''}" data-act="verify" data-v="0" ${vDisabled}>${no}</button></div></div></div>`;

  if (t.done) return head + msg + step1 + step2 + resultView(t);

  const did = new Set(st.actions.map(a => a.type));
  let tools;
  if (isCreate){
    const f = st.form;
    const deptOpts = ['<option value="">Choose…</option>', ...DEPTS.map(d => `<option ${f.dept === d ? 'selected' : ''}>${d}</option>`)].join('');
    const licOpts = ['<option value="">Choose…</option>', ...LICENSES.map(l => `<option ${f.license === l ? 'selected' : ''}>${l}</option>`)].join('');
    const groups = ALL_GROUPS.map(g => `<label><input type="checkbox" id="g-${g}" data-field="group" value="${g}" ${f.groups.includes(g) ? 'checked' : ''}>${g}</label>`).join('');
    tools = `<div class="subpanel"><div class="form">
        <label>Username<input type="text" id="f-username" data-field="username" value="${esc(f.username)}" autocomplete="off" spellcheck="false" placeholder="e.g. jdoe"></label>

      <button class="btn danger" data-act="do" data-v="escalate" ${did.has('escalate') ? 'disabled' : ''}>Escalate to Security</button></div>
      ${st.resetOpen && !did.has('reset') ? `<div class="subpanel"><div><p class="eyebrow">Temporary password</p><p class="temp">${t.temp}</p></div>
        <label class="check"><input type="checkbox" id="mustChange"> Require change at next sign-in</label>

  }
  const log = st.actions.length ? `<ul class="log">${st.actions.map(a => `<li>${esc(a.line)}</li>`).join('')}</ul>` : '';
  const step3 = `<div class="step ${st.actions.length ? 'done' : ''}"><span class="n">3</span><div class="step-body"><h3>${isCreate ? 'Provision or escalate' : 'Take action'}</h3>${tools}${log}</div></div>`;
  const step4 = `<div class="step"><span class="n">4</span><div class="step-body"><h3>Close it out</h3>
    ${st.hint ? `<p class="hint">${esc(K.hint)}</p>` : ''}

  return head + msg + step1 + step2 + step3 + step4;
}

function resultView(t){
  const r = t.result, open = state.shift.tickets.some(x => !x.done);
  const d = [];
  if (state.founder) d.push(`<span class="pill gold">Valuation ×${r.val.toFixed(2)}</span>`);
  if (r.cash) d.push(`<span class="pill ${r.cash > 0 ? 'ok' : 'bad'}">${r.cash > 0 ? '+' : ''}${money(r.cash)}</span>`);
  d.push(`<span class="pill info">+${r.xp} XP</span>`);
  d.push(`<span class="pill ${r.rep >= 0 ? 'ok' : 'bad'}">Rep ${r.rep >= 0 ? '+' : ''}${r.rep}</span>`);
  if (r.gems) d.push(`<span class="pill gold">+${r.gems} gem</span>`);
  if (r.level === 0) d.push(`<span class="pill ${r.inSla ? 'ok' : 'warn'}">${r.inSla ? 'Within SLA' : 'SLA missed'}</span>`);
  const log = t.st.actions.length ? `<ul class="log">${t.st.actions.map(a => `<li>${esc(a.line)}</li>`).join('')}</ul>` : '<p class="muted">No actions taken.</p>';
  return `<div class="result l${r.level}" role="status"><h3>${GRADE[r.level]}</h3><ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <div class="delta">${d.join('')}</div>${log}
    <div class="row">${open ? '<button class="btn primary" data-act="next">Next ticket</button>' : '<button class="btn primary" data-act="end">Clock out</button>'}</div></div>`;
}

/* ---------- empire engine ---------- */
function initEmpire(cash){
  state.empire = {dcs:[], staff:{tech:0,sre:0,sec:0,sales:0}, incidents:[], log:[], os:{stage:0,endsAt:null}, lastTs:Date.now(), earned:0, seq:1};
  state.cash += cash;
}
const salaryScale = () => Math.pow(2, Math.max(0, state.empire.dcs.length - 1));
const staffCap = () => 2 + 2 * state.empire.dcs.length;
const hireCost = s => s.salary * salaryScale() * 600;
function revMult(){
  const e = state.empire, c = e.os.stage;
  return (1 + .04 * e.staff.tech + .06 * e.staff.sales) * (1 + .2 * Math.min(c, 4) + (c >= 5 ? .5 : 0));
}
const dcRev = dc => dc.racks * rackRev(dc.tier) * (dc.health / 100) * (dc.down ? .2 : 1) * revMult();
const revPerSec = () => state.empire.dcs.reduce((a, d) => a + dcRev(d), 0);
const payPerSec = () => STAFF.reduce((a, s) => a + state.empire.staff[s.id] * s.salary * salaryScale(), 0);
const coverage = () => { const n = state.empire.dcs.length; return n ? state.empire.staff.sre * 2 / n : 0; };
const avgHealth = () => { const d = state.empire.dcs; return d.length ? Math.round(d.reduce((a, x) => a + x.health, 0) / d.length) : 100; };

let dirty = false;
function empireTick(){
  const e = state.empire; if (!state.founder || !e) return;
  const now = Date.now(); let dt = (now - e.lastTs) / 1000; e.lastTs = now;
  if (dt <= 0) return;
  const away = dt > 5, eff = away ? .5 : 1;
  if (away) dt = Math.min(dt, 8 * 3600);
  const rev = revPerSec(), pay = payPerSec();
  const gross = rev * dt * eff, net = (rev - pay) * dt * eff;
  state.cash += net; e.earned += gross; state.founder.valuation += gross * 15;
  const cov = Math.min(1, coverage());
  for (const dc of e.dcs) dc.health = clamp(dc.health + (.045 * cov - .03 + .008 * dc.cooling) * dt * eff, 0, 100);
  if (e.os.endsAt && now >= e.os.endsAt){ e.os.stage++; e.os.endsAt = null; toast(`${OS_STAGES[e.os.stage - 1].name} shipped. Revenue boosted.`); dirty = true; }
  if (away){
    if (dt > 120) state.modals.push({type:'away', data:{secs:dt, net}});
    dirty = true;
  } else {
    if (e.incidents.length < 3){
      for (const [i, dc] of e.dcs.entries()){
        if (dc.down || !dc.racks || Math.random() >= dt / 360) continue;
        const T = rnd(INCIDENTS);
        if (T.id === 'cooling' && Math.random() < .25 * dc.cooling) continue;
        if (T.sec && Math.random() < Math.min(.8, .2 * e.staff.sec)) continue;
        const inc = {id:e.seq++, type:T.id, dc:i, age:0, order:shuffle([0, 1, 2])};
        dc.down = inc.id; e.incidents.push(inc); dirty = true;
        if (state.tab !== 'empire') toast(`Incident in ${CITIES[i]}: ${T.title}`);
        break;
      }
    }
    for (const inc of [...e.incidents]){
      inc.age += dt;
      if (cov >= 1 && inc.age >= 30) resolveIncident(inc.id, 0, true);
      else if (cov >= .5 && inc.age >= 60) resolveIncident(inc.id, 1, true);
    }
  }
  if (state.rank === 5 && netWorth() >= 1e9 && !state.modals.some(m => m.type === 'billionaire')){ state.modals.push({type:'billionaire'}); dirty = true; }
  if (state.rank === 6) for (const m of MILESTONES) if (netWorth() >= m.v && !state.milestones.includes(m.v)){
    state.milestones.push(m.v); state.gems += m.gems; state.modals.push({type:'milestone', v:m.v}); dirty = true;
  }
}
function resolveIncident(id, quality, auto){
  const e = state.empire, inc = e.incidents.find(x => x.id === id); if (!inc) return;
  const T = INCIDENTS.find(x => x.id === inc.type);
  const oi = auto ? T.opts.findIndex(o => o[1] === quality) : quality;
  const [label, q, lesson] = T.opts[oi], dc = e.dcs[inc.dc];
  const cost = Math.max(2000, rackRev(dc.tier) * Math.max(1, dc.racks) * [30, 90, 240][q]);
  state.cash -= cost; dc.health = clamp(dc.health + [5, -10, -30][q], 0, 100); state.rep = clamp(state.rep + [2, 0, -4][q], 0, 100);
  dc.down = null; e.incidents = e.incidents.filter(x => x !== inc);
  e.log.unshift({city:CITIES[inc.dc], title:T.title, choice:label, q, lesson, cost, auto:!!auto}); e.log = e.log.slice(0, 8);
  dirty = true;
  return {q, lesson};
}
function spend(cost){
  if (state.cash < cost){ toast(`You need ${money(cost - state.cash)} more.`); return false; }
  state.cash -= cost; return true;
}
function autoNote(inc){
  const cov = coverage();
  if (cov >= 1) return `Your SRE team will handle it in ${Math.max(0, Math.ceil(30 - inc.age))}s if you don't.`;
  if (cov >= .5) return `Your SREs will patch it, imperfectly, in ${Math.max(0, Math.ceil(60 - inc.age))}s if you don't.`;
  return 'No SRE coverage here. This waits for you.';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const v = b.dataset.v, t = activeTicket();
  switch (b.dataset.act){
    case 'tab': state.tab = v; state.confirmReset = false; commit(); break;
    case 'start': startShift(); break;
    case 'pick': state.shift.active = v; commit(); break;
    case 'lookup': t.st.lookedUp = true; commit(); break;
    case 'verify': t.st.verified = v === '1'; commit(); break;
    case 'resetOpen':
      if (!t.st.lookedUp){ toast('Look up the account first.'); break; }
      t.st.resetOpen = !t.st.resetOpen; commit(); break;
    case 'do': act(v); break;
    case 'avail': {
      const u = t.st.form.username.trim().toLowerCase(), x = t.expectForm;
      t.st.avail = !u ? 'Type a username first.' : (u === x.base && x.taken) ? `${u} is taken by ${x.twin}.` : `${u} is available.`;
      commit(); break;
    }
    case 'hint':
      if (state.gems < 1){ toast('You are out of gems. Earn more with clean tickets.'); break; }
      state.gems--; t.st.hint = true; commit(); break;
    case 'resolve': resolve(); break;
    case 'next': nextTicket(); break;
    case 'end': endShift(); break;
    case 'buy': {
      const it = SHOP.find(i => i.id === v);
      if (state.cash < it.price){ toast(`You need ${money(it.price - state.cash)} more.`); break; }
      state.cash -= it.price; state.items.push(v); toast(`${it.name} installed.`); commit(); break;
    }
    case 'outfit': {
      const o = OUTFITS.find(x => x.id === v);
      if (state.gems < o.gems){ toast(`You need ${o.gems - state.gems} more gems.`); break; }
      state.gems -= o.gems; state.outfits.push(v); state.outfit = v; toast(`${o.name} unlocked.`); commit(); break;
    }
    case 'wear': state.outfit = v; commit(); break;
    case 'iap': {
      const p = PACKS.find(x => x.id === v);
      state.gems += p.gems; if (p.id === 'starter' && !owns('espresso')) state.items.push('espresso');
      toast(`Demo: added ${p.gems} gems. No payment taken.`); commit(); break;
    }
    case 'choose': {
      const m = state.modals[0], spec = modalSpec(m), c = spec.choices[+v];
      if (spec.input){
        const name = ($('#startupName').value || '').trim().slice(0, 24) || 'KeyForge';
        c.fx(name);
      } else c.fx();
      if (m.type === 'story' || m.type === 'seriesA' || m.type === 'billionaire') journal(spec.title, c.label);
      state.modals.shift(); commit(); break;
    }
    case 'build': {
      const e = state.empire, n = e.dcs.length; if (n >= CITIES.length) break;
      if (!spend(dcCost(n))) break;
      e.dcs.push({tier:n, racks:1, exp:0, cooling:0, health:100, down:null});
      journal(`Opened a datacenter in ${CITIES[n]}`, n ? `Region ${n + 1}` : 'A rented cage and one rack');
      toast(`${CITIES[n]} is online.`); commit(); break;
    }
    case 'rack': { const dc = state.empire.dcs[+v]; if (dc.racks < maxRacks(dc) && spend(rackCost(dc.tier, dc.racks))){ dc.racks++; commit(); } break; }
    case 'expand': { const dc = state.empire.dcs[+v]; if (dc.exp < 3 && spend(expandCost(dc))){ dc.exp++; toast(`${CITIES[+v]} hall expanded to ${maxRacks(dc)} racks.`); commit(); } break; }
    case 'cool': { const dc = state.empire.dcs[+v]; if (dc.cooling < 3 && spend(coolCost(dc))){ dc.cooling++; commit(); } break; }
    case 'maint': { const dc = state.empire.dcs[+v]; if (spend(maintCost(dc))){ dc.health = 100; toast(`${CITIES[+v]} serviced. Health 100%.`); commit(); } break; }
    case 'hire': { const s = STAFF.find(x => x.id === v); if (state.empire.staff[v] < staffCap() && spend(hireCost(s))){ state.empire.staff[v]++; commit(); } break; }
    case 'fire': if (state.empire.staff[v] > 0){ state.empire.staff[v]--; commit(); } break;
    case 'os': {
      const os = state.empire.os, s = OS_STAGES[os.stage];
      if (s && !os.endsAt && spend(s.cost)){ os.endsAt = Date.now() + s.secs * 1000; commit(); } break;
    }
    case 'incident': {
      const [id, oi] = v.split(':').map(Number);
      const r = resolveIncident(id, oi, false);
      if (r) toast(`${['Good call.','Partly worked.','Bad call.'][r.q]} ${r.lesson}`);
      commit(); break;
    }
    case 'devFounder':
      if (state.rank >= 5) break;
      state.shift = null; state.rank = 5; state.xp = Math.max(state.xp, RANKS[5].xp);
      state.modals.push({type:'story', rank:5}); state.tab = 'empire'; commit(); break;
    case 'wipeAsk': state.confirmReset = true; commit(); break;
    case 'wipeCancel': state.confirmReset = false; commit(); break;
    case 'wipe': state = fresh(); commit(); break;
  }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field; if (!f) return;
  const t = activeTicket();
  if (f === 'username') t.st.form.username = e.target.value;
  if (f === 'name'){ state.name = e.target.value || 'Jordan Lee'; renderHud(); }
  save();
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.field; if (!f) return;
  const t = activeTicket();
  if (f === 'dept') t.st.form.dept = e.target.value;
  if (f === 'license') t.st.form.license = e.target.value;
  if (f === 'group'){
    const g = t.st.form.groups, val = e.target.value;
    if (e.target.checked && !g.includes(val)) g.push(val);
    if (!e.target.checked) t.st.form.groups = g.filter(x => x !== val);
  }
  if (f === 'name') render();
  save();
});

/* ---------- clock ---------- */
let ticks = 0, pending = false;
function tick(){
  dirty = false;
  empireTick();
  shiftTick();
  const typing = document.activeElement && document.activeElement.matches('#view input, #view select, #modalRoot input');
  if ((dirty || pending) && !typing){ pending = false; save(); render(); }
  else {
    if (dirty) pending = true;
    renderHud(); renderTabs();
    if (state.tab === 'empire') updateLive();
  }
  if (++ticks % 5 === 0) save();
}
function shiftTick(){
  if (!state.shift || state.modals.length || document.hidden) return;
  for (const t of state.shift.tickets) if (!t.done) t.age++;
  for (const t of state.shift.tickets){
    if (t.done) continue;
    const sl = slaInfo(t);
    const bar = document.querySelector(`[data-sla="${t.id}"]`);
    if (bar){ bar.className = `sla ${sl.cls}`; bar.querySelector('i').style.width = sl.pct + '%'; bar.querySelector('span').textContent = sl.txt; }
    const pill = document.querySelector(`[data-slapill="${t.id}"]`);
    if (pill){ pill.className = `pill ${sl.cls}`; pill.textContent = sl.txt; }
  }
}

/* ---------- boot ---------- */
function start(data){
  state = (data && data.v === 1) ? data : (load() || fresh());
  state.milestones = state.milestones || [];
  if (state.founder && !state.empire) initEmpire(150e3);
  window.claude?.hot?.snapshot?.(() => state);
  dirty = false; empireTick();
  render();
  setInterval(tick, 1000);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
